# Redirecionamento do hostname antigo para o domínio novo (HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name vps55549.publiccloud.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 http://minhamania.net$request_uri;
    }
}

# Configuração principal para os domínios novos (HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name minhamania.net www.minhamania.net;

    root /var/www/public;
    index index.php index.html;

    # Suporte ao Let's Encrypt (webroot)
	location ^~ /.well-known/acme-challenge/ {
		root /var/www;
		default_type "text/plain";
		try_files $uri =404;
	}

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /tiktok-api/ {
        proxy_pass http://host.docker.internal:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /insta-api/ {
        proxy_pass http://host.docker.internal:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ \.php$ {
        fastcgi_pass laravel-app:9000;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    client_max_body_size 20M;
}

# HTTPS para os domínios novos
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name minhamania.net www.minhamania.net;

    ssl_certificate /etc/letsencrypt/live/minhamania.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minhamania.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/public;
    index index.php index.html;

