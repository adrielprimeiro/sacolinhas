version: '3.8'

services:
  app:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
    container_name: laravel-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/custom.ini
    ports:
      - "9000:9000"
    depends_on:
      - db
    networks:
      - sacolinhas-network
    environment:
      - DB_HOST=mysql-db
      - DB_DATABASE=sacolinhas_db
      - DB_USERNAME=sacolinhas_user
      - DB_PASSWORD=SenhaSuperSegura123!

  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: sacolinhas_db
      MYSQL_USER: sacolinhas_user
      MYSQL_PASSWORD: SenhaSuperSegura123!
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - sacolinhas-network

  nginx:
    image: nginx:alpine
    container_name: nginx-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - sacolinhas-network

  vite:
    build:
      context: ./docker/vite
      dockerfile: Dockerfile
    container_name: sacolinhas-vite
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173"
    networks:
      - sacolinhas-network

volumes:
  mysql_data:

networks:
  sacolinhas-network:
    driver: bridge
