version: '3.8'

services:
  app:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
    container_name: laravel-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/custom.ini
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
    networks:
      - sacolinhas-network
    environment:
      TZ: America/Sao_Paulo
      QUEUE_CONNECTION: database
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sacolinhas_db
      DB_USERNAME: sacolinhas_user
      DB_PASSWORD: SenhaSuperSegura123!
      PHP_UPLOAD_MAX_FILESIZE: 500M
      PHP_POST_MAX_SIZE: 500M
      PHP_MAX_EXECUTION_TIME: 600  

  db:
    healthcheck:
     test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
     interval: 5s
     timeout: 3s
     retries: 20
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: sacolinhas_db
      MYSQL_USER: sacolinhas_user
      MYSQL_PASSWORD: SenhaSuperSegura123!
      TZ: America/Sao_Paulo
    command: --default-authentication-plugin=mysql_native_password --default-time-zone='America/Sao_Paulo' --log_bin_trust_function_creators=1
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      - sacolinhas-network

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: nginx-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/letsencrypt:/etc/letsencrypt
      - ./docker/letsencrypt-lib:/var/lib/letsencrypt
      - ./docker/letsencrypt-log:/var/log/letsencrypt
    depends_on:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sacolinhas-network

      

  laravel-worker:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
    container_name: sacolinhas_worker
    working_dir: /var/www
    volumes:
      - ./:/var/www
    restart: always
    depends_on:
      - db
      - app
    networks:
      - sacolinhas-network
    environment:
      - TZ=America/Sao_Paulo
      - QUEUE_CONNECTION=database
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=sacolinhas_db
      - DB_USERNAME=sacolinhas_user
      - DB_PASSWORD=SenhaSuperSegura123!
    # Script que espera o banco ficar pronto antes de iniciar o worker
    command: >
      sh -c "
      echo 'Iniciando worker...' &&
      php /var/www/docker/app/wait-for-mysql.php &&
      echo 'Banco pronto, iniciando queue worker...' &&
      php artisan queue:work --queue=whatsapp,default --tries=3 --sleep=1 --backoff=5 --timeout=120
      "

volumes:
  mysql_data:
  backups:

networks:
  sacolinhas-network:
    driver: bridge
